<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0A0907" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Chelsea Man Spa — Premium grooming and wellness in Dubai Marina. Book your appointment." />
  <meta name="format-detection" content="telephone=no" />

  <title>Chelsea Man Spa</title>

  <!-- Google Fonts: Playfair Display for headings, Inter for body -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- App Container -->
  <div id="app">
    <!-- Loading Screen -->
    <div id="loading">
      <div class="load-brand">Chelsea Man Spa</div>
      <div class="load-bar-wrap">
        <div class="load-bar"></div>
      </div>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- Firebase SDKs (compat — global script loading) -->
  <!-- ============================================ -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js">
  </script>

  <!-- ============================================ -->
  <!-- Core Modules (load order is critical)        -->
  <!-- ============================================ -->

  <!-- 1. Config — Firebase constants, time slots -->
  <script src="js/config.js"></script>

  <!-- 2. Data — Hardcoded services, stylists, addons -->
  <script src="js/data.js"></script>

  <!-- 3. State — Global STATE object, date utilities -->
  <script src="js/state.js"></script>

  <!-- 4. Auth — Firebase auth: sign-in, sign-out, listener -->
  <script src="js/auth.js"></script>

  <!-- 5. Navigation — Tab bar, page stack, boot -->
  <script src="js/navigation.js"></script>

  <!-- 6. UI — Shared rendering utilities -->
  <script src="js/ui.js"></script>

  <!-- 7. Views — One file per screen -->
  <script src="js/views/auth.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/services.js"></script>
  <script src="js/views/stylists.js"></script>
  <script src="js/views/datetime.js"></script>
  <script src="js/views/checkout.js"></script>
  <script src="js/views/confirmed.js"></script>
  <script src="js/views/bookings.js"></script>
  <script src="js/views/profile.js"></script>

  <!-- 8. App — Entry point: Firebase init, auth listener, boot -->
  <script src="js/app.js"></script>

  <!-- ============================================ -->
  <!-- Global Error Catcher                         -->
  <!-- ============================================ -->
  <script>
    /**
     * Global error handler — catches unhandled JS errors
     * and displays a user-friendly message in the app.
     */
    window.onerror = function (msg, url, line, col, err) {
      console.error('Global error:', msg, 'at', url, line, ':', col);
      const app = document.getElementById('app');
      if (app) {
        app.innerHTML = ''
          + '<div style="padding:40px 24px;text-align:center;">'
          + '<div style="font-family:var(--display);font-size:1.5rem;color:var(--cream);margin-bottom:12px;">Something went wrong</div>'
          + '<div style="font-family:var(--body);font-size:0.875rem;color:var(--sec);margin-bottom:24px;">'
          + 'Please refresh the page or try again later.</div>'
          + '<button onclick="location.reload()" class="btn btn-primary btn-full" '
          + 'style="max-width:240px;margin:0 auto;">Refresh</button>'
          + '</div>';
      }
      return true;
    };
  </script>
</body>
</html>
