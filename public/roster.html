<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chelsea Man Spa — Stylist Roster</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0A0907;
      color: #F5EDE3;
      min-height: 100vh;
      padding: 32px 24px;
    }
    .container { max-width: 960px; margin: 0 auto; }

    .nav-bar {
      display: flex; align-items: center; gap: 24px;
      margin-bottom: 32px; padding-bottom: 16px;
      border-bottom: 1px solid #1E1C18;
    }
    .nav-bar a {
      color: #9C927D; text-decoration: none; font-size: 0.875rem; font-weight: 500;
      transition: color 0.2s;
    }
    .nav-bar a:hover { color: #D4AF37; }
    .nav-bar .current {
      color: #D4AF37; font-weight: 600; font-size: 1.5rem;
    }

    .header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 32px;
    }
    .header h1 {
      font-size: 1.5rem; font-weight: 700;
      color: #D4AF37; letter-spacing: 0.02em;
    }
    .btn-add {
      background: #D4AF37; color: #0A0907; border: none;
      padding: 14px 28px; border-radius: 6px;
      font-size: 0.875rem; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-add:hover { opacity: 0.85; }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%; border-collapse: collapse;
      background: #12110E; border-radius: 8px; overflow: hidden;
    }
    th, td {
      text-align: left; padding: 14px 16px; font-size: 0.875rem;
    }
    th {
      background: #1A1814; color: #D4AF37; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    td { color: #F5EDE3; border-bottom: 1px solid #1E1C18; }
    .empty td { text-align: center; color: #6B655A; padding: 40px 16px; font-style: italic; }
    .status-available { color: #4ADE80; }
    .status-unavailable { color: #E87A7A; }
    .btn-edit, .btn-delete {
      padding: 8px 16px; border-radius: 6px; border: none;
      font-size: 0.8rem; font-weight: 600; cursor: pointer;
    }
    .btn-edit { background: #D4AF37; color: #0A0907; }
    .btn-delete { background: #3D1A1A; color: #E87A7A; }

    @media (max-width: 768px) {
      .nav-bar { flex-wrap: wrap; gap: 12px; }
      .nav-bar .current { font-size: 1.25rem; }
    }

    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.65); z-index: 999;
      align-items: center; justify-content: center;
    }
    .overlay.show { display: flex; }
    .modal {
      background: #12110E; border: 1px solid #1E1C18;
      border-radius: 10px; width: 100%; max-width: 480px;
      padding: 28px 24px; margin: 16px;
    }
    .modal h2 {
      font-size: 1.125rem; color: #D4AF37; margin-bottom: 20px;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; font-size: 0.8rem; color: #9C927D;
      margin-bottom: 4px; font-weight: 500;
    }
    .form-group input, .form-group select {
      width: 100%; padding: 10px 12px; border-radius: 6px;
      border: 1px solid #1E1C18; background: #0A0907;
      color: #F5EDE3; font-size: 0.875rem; font-family: inherit;
      outline: none; transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus { border-color: #D4AF37; }
    .form-group select option { background: #0A0907; }
    .modal-actions {
      display: flex; gap: 12px; margin-top: 24px;
    }
    .modal-actions button { flex: 1; padding: 10px; border-radius: 6px; font-size: 0.875rem; font-weight: 600; cursor: pointer; border: none; }
    .btn-save { background: #D4AF37; color: #0A0907; }
    .btn-save:hover { opacity: 0.85; }
    .btn-cancel { background: #1E1C18; color: #9C927D; }
    .btn-cancel:hover { color: #F5EDE3; }
  </style>
</head>
<body>
  <script>if ((localStorage.getItem('userRole') || '').toLowerCase() !== 'admin') { window.location.href = 'index.html'; }</script>
  <div class="container">
    <div class="nav-bar">
      <span id="admin-nav-links">
        <a href="index.html">Dashboard</a>
        <a href="services.html">Services</a>
        <a href="bookings.html">Bookings</a>
      </span>
      <span class="current">Roster</span>
    </div>

    <div class="header">
      <h1>Stylist Roster</h1>
      <button class="btn-add" id="btn-add-stylist">+ Add New Stylist</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Role</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="stylist-table-body">
          <tr class="empty">
            <td colspan="4">No stylists loaded yet.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="overlay" id="stylist-modal">
    <div class="modal">
      <form id="stylist-form">
        <h2 id="modal-title">Add New Stylist</h2>
        <div class="form-group">
          <label for="stylist-name">Name</label>
          <input type="text" id="stylist-name" name="name" placeholder="e.g. Mustafa" required />
        </div>
        <div class="form-group">
          <label for="stylist-role">Role</label>
          <input type="text" id="stylist-role" name="role" placeholder="e.g. Master Barber" />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="btn-cancel">Cancel</button>
          <button type="submit" class="btn-save" id="btn-save">Save Stylist</button>
        </div>
      </form>
    </div>
  </div>

  <div class="overlay" id="deleteModal">
    <div class="modal">
      <h2>Confirm Delete</h2>
      <p style="color:#9C927D;font-size:0.9rem;margin-bottom:20px;">Are you sure you want to delete this stylist? This action cannot be undone.</p>
      <div class="modal-actions">
        <button class="btn-cancel" id="cancelDeleteBtn">Cancel</button>
        <button class="btn-save" id="confirmDeleteBtn" style="background:#3D1A1A;color:#E87A7A;">Delete</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/authGuard.js"></script>
  <script src="js/rosterManager.js"></script>
</body>
</html>
