<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chelsea Man Spa — Staff Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0A0907;
      color: #F5EDE3;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .login-box {
      background: #12110E; border: 1px solid #1E1C18;
      border-radius: 10px; width: 100%; max-width: 400px;
      padding: 36px 28px;
    }
    .login-box h1 {
      font-size: 1.25rem; font-weight: 700; color: #D4AF37;
      text-align: center; margin-bottom: 4px;
    }
    .login-box .sub {
      font-size: 0.8rem; color: #9C927D; text-align: center;
      margin-bottom: 28px;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; font-size: 0.8rem; color: #9C927D;
      margin-bottom: 4px; font-weight: 500;
    }
    .form-group input {
      width: 100%; padding: 10px 12px; border-radius: 6px;
      border: 1px solid #1E1C18; background: #0A0907;
      color: #F5EDE3; font-size: 0.875rem; font-family: inherit;
      outline: none; transition: border-color 0.2s; box-sizing: border-box;
    }
    .form-group input:focus { border-color: #D4AF37; }
    .password-wrapper { position: relative; }
    .password-wrapper input { padding-right: 36px; }
    .toggle-pw {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; padding: 4px;
      color: #8A8070; font-size: 1.1rem; line-height: 1;
    }
    .toggle-pw:hover { color: #D4AF37; }
    .btn-login {
      width: 100%; padding: 12px; border-radius: 6px;
      background: #D4AF37; color: #0A0907; border: none;
      font-size: 0.875rem; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s; margin-top: 8px;
    }
    .btn-login:hover { opacity: 0.85; }
    .error-msg {
      color: #E87A7A; font-size: 0.8rem; text-align: center;
      margin-top: 12px; display: none;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>Chelsea Man Spa</h1>
    <div class="sub">Staff Login</div>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="staff@chelseamanspa.com" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Enter your password" required />
          <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Toggle password visibility">🙈</button>
        </div>
      </div>
      <button type="submit" class="btn-login" id="btn-login">Sign In</button>
    </form>
    <div class="error-msg" id="error-message"></div>
    <div style="text-align:center;margin-top:20px;font-size:0.8rem;color:#9C927D;">
      Don't have an account? <a href="signup.html" style="color:#D4AF37;text-decoration:none;font-weight:500;">Sign up</a>
    </div>
    <div style="text-align:center;margin-top:12px;">
      <a href="index.html" style="color:#9C927D;text-decoration:none;font-size:0.8rem;">&larr; Back to Home</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('toggle-pw').addEventListener('click', function () {
      var pw = document.getElementById('password');
      var hidden = pw.type === 'password';
      pw.type = hidden ? 'text' : 'password';
      this.textContent = hidden ? '👁️' : '🙈';
    });

    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      console.log('Login form submitted');

      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var errorEl = document.getElementById('error-message');
      var btn = document.getElementById('btn-login');

      btn.disabled = true;
      btn.textContent = 'Signing in…';
      errorEl.style.display = 'none';

      await signIn(email, password);
      btn.disabled = false;
      btn.textContent = 'Sign In';
    });
  </script>
</body>
</html>
