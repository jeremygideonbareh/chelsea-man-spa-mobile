<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chelsea Man Spa — Create Account</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0A0907;
      color: #F5EDE3;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .signup-box {
      width: 100%; max-width: 380px;
      background: #12110E; border: 1px solid #1E1C18;
      border-radius: 12px; padding: 40px 32px;
    }
    .signup-box h1 {
      font-size: 1.5rem; font-weight: 700; color: #D4AF37;
      text-align: center; margin-bottom: 4px;
    }
    .signup-box .sub {
      font-size: 0.8rem; color: #9C927D; text-align: center;
      margin-bottom: 28px; font-weight: 500;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; font-size: 0.8rem; font-weight: 500;
      color: #9C927D; margin-bottom: 4px;
    }
    .form-group input {
      width: 100%; padding: 10px 12px; border-radius: 6px;
      border: 1px solid #1E1C18; background: #0A0907;
      color: #F5EDE3; font-size: 0.875rem; font-family: inherit;
      outline: none; transition: border-color 0.2s; box-sizing: border-box;
    }
    .form-group input:focus { border-color: #D4AF37; }
    .btn-signup {
      width: 100%; padding: 12px; border-radius: 6px;
      background: #D4AF37; color: #0A0907; border: none;
      font-size: 0.875rem; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s; margin-top: 8px;
    }
    .btn-signup:hover { opacity: 0.85; }
    .btn-signup:disabled { opacity: 0.5; cursor: not-allowed; }
    .footer-link {
      text-align: center; margin-top: 20px; font-size: 0.8rem; color: #9C927D;
    }
    .footer-link a { color: #D4AF37; text-decoration: none; font-weight: 500; }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="signup-box">
    <h1>Chelsea Man Spa</h1>
    <div class="sub">Create Your Account</div>
    <form id="signup-form">
      <div class="form-group">
        <label for="full-name">Full Name</label>
        <input type="text" id="full-name" placeholder="e.g. John Doe" required />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password" required minlength="6" />
      </div>
      <button type="submit" class="btn-signup" id="btn-signup">Create Account</button>
    </form>
    <div class="footer-link">
      Already have an account? <a href="login.html">Log in</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('signup-form').addEventListener('submit', async function (e) {
      e.preventDefault();

      var fullName = document.getElementById('full-name').value.trim();
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var btn = document.getElementById('btn-signup');

      btn.disabled = true;
      btn.textContent = 'Creating account…';

      await handleSignUp(fullName, email, password);

      btn.disabled = false;
      btn.textContent = 'Create Account';
    });
  </script>
</body>
</html>
